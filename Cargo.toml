[package]
name = "unibox"
version = "0.1.0"
edition = "2021"
description = "Unified inbox reader for several Gmail accounts"

[dependencies]
anyhow = "1"
ammonia = "4"
axum = "0.7"
dirs = "5"
mail-parser = "0.9"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
webpki-roots = "0.26"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# the app window: a native frame hosting the WebView2 runtime that ships with Windows
tao = "0.37"
wry = "0.57"

[profile.release]
opt-level = 2
strip = true
